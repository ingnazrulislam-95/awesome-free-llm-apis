<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free AI Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .chat-container {
      width: 100%;
      max-width: 650px;
      background: #1e293b;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      height: 85vh;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid #334155;
    }
    .chat-header {
      padding: 16px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      font-weight: 600;
      font-size: 16px;
      text-align: center;
    }
    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 8px;
      line-height: 1.5;
      font-size: 15px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .user {
      background: #2563eb;
      align-self: flex-end;
      color: white;
    }
    .assistant {
      background: #334155;
      align-self: flex-start;
      color: #f1f5f9;
    }
    .error {
      background: #991b1b;
      align-self: center;
      color: #fecaca;
      font-size: 13px;
    }
    .input-row {
      display: flex;
      padding: 12px;
      background: #0f172a;
      border-top: 1px solid #334155;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #1e293b;
      color: white;
      outline: none;
      font-size: 15px;
    }
    input:focus {
      border-color: #3b82f6;
    }
    button {
      padding: 12px 20px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
    }
    button:hover:not(:disabled) {
      background: #1d4ed8;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">AI Assistant</div>
  <div class="chat-box" id="chatBox">
    <div class="message assistant">Hello! Type a message below to start chatting.</div>
  </div>
  <form class="input-row" id="chatForm">
    <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off" required />
    <button type="submit" id="sendBtn">Send</button>
  </form>
</div>

<script>
  const WORKER_URL = "https://my-llm-chat-api.ing-nazrul-islam.workers.dev/";
  const chatBox = document.getElementById("chatBox");
  const chatForm = document.getElementById("chatForm");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");

  const conversation = [];

  function appendMessage(role, text) {
    const msg = document.createElement("div");
    msg.className = `message ${role}`;
    msg.textContent = text;
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
    return msg;
  }

  chatForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = userInput.value.trim();
    if (!text) return;

    appendMessage("user", text);
    conversation.push({ role: "user", content: text });
    userInput.value = "";

    sendBtn.disabled = true;
    const loadingMsg = appendMessage("assistant", "Thinking...");

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: conversation })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || `Server error: ${response.status}`);
      }

      loadingMsg.textContent = data.reply;
      conversation.push({ role: "assistant", content: data.reply });
    } catch (err) {
      loadingMsg.className = "message error";
      loadingMsg.textContent = `Error: ${err.message}`;
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  });
</script>

</body>
</html>
